; PlatformIO build for the DIY Arcade Stick (Freenove FNK0104, ESP32-S3)
[env:arcade_stick]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags =
  -DARDUINO_USB_MODE=1
; libraries, pinned to the exact git tags the release bins are built from
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#1.2.32
  https://github.com/lemmingDev/ESP32-BLE-Gamepad.git#v0.8.0
  https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
monitor_speed = 115200
